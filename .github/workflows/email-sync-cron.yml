name: Email Sync Cron

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  trigger-email-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call Email Sync endpoint
        run: |
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::CRON_SECRET is not configured in GitHub Repository Secrets. Go to Settings -> Secrets and variables -> Actions to add it."
            exit 1
          fi
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://vaulty.mnilay.com/api/cron/email-sync)
          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')
          echo "Response: $HTTP_BODY"
          echo "Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Email sync call failed with HTTP $HTTP_STATUS. Ensure CRON_SECRET in GitHub Secrets matches production CRON_SECRET and is >= 32 characters."
            exit 1
          fi
